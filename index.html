  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = "https://rcsrazcvehnjgflkcslo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KyWxNv1LHTxkTeuXVgkNuA_1jOf7oTp";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = { username: "Guest", coins: 0, level: 1 };
    let isSignUpMode = false;

    // 2. Fetch User & Profile
    async function initUser() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;
      if (user) {
        let { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
        if (profile) {
          currentProfile = profile;
        } else {
          currentProfile = { username: user.email.split('@')[0], coins: 0, level: 1 };
        }
        document.getElementById('auth-btn').innerHTML = `<i data-lucide="log-out" class="w-4 h-4"></i> Logout`;
      } else {
        document.getElementById('auth-btn').innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Login / Register`;
      }
      updateUIHeader();
      renderHome();
      lucide.createIcons();
    }

    function updateUIHeader() {
      document.getElementById('user-coins').innerText = Number(currentProfile.coins).toLocaleString();
      document.getElementById('menu-username').innerText = currentProfile.username;
      document.getElementById('menu-level').innerText = "Lvl " + (currentProfile.level || 1);
    }

    // 3. Navigation View Router
    function navigate(view) {
      document.getElementById('profile-dropdown').classList.add('hidden');
      const container = document.getElementById('app-content');
      
      if (view === 'home') renderHome();
      else if (view === 'shop') renderShop();
      else if (view === 'ranking') renderRanking();
      else if (view === 'profile') renderProfile();
      else if (view === 'daily') renderDaily();
      else if (view === 'chat') renderChat();
      
      lucide.createIcons();
    }

      container.innerHTML = `
        <div class="bg-[#141c24] border border-[#222f3d] rounded-2xl p-4 text-center flex flex-col items-center gap-3">
          <span class="text-4xl">🎁</span>
          <h3 class="font-bold text-white text-base">Daily Streak Bonus</h3>
          <p class="text-xs text-slate-400">Claim free coins everyday to maintain your streak!</p>
          <button onclick="claimDailyBonus()" class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold px-6 py-2 rounded-xl text-sm transition">Claim 100 Coins</button>
        </div>
      `;
    }

    function renderChat() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="bg-[#141c24] border border-[#222f3d] rounded-2xl p-4 flex flex-col h-80 justify-between">
          <div class="text-xs text-slate-400 border-b border-[#222f3d] pb-2 font-bold">Community Chat (Global)</div>
          <div class="flex-1 py-2 overflow-y-auto text-xs flex flex-col gap-2 text-slate-300">
            <div><strong class="text-emerald-400">Kaallu:</strong> Completed animals and coins in 2 days!</div>
            <div><strong class="text-amber-400">Sinful:</strong> LTC cashout received fast 🚀</div>
          </div>
          <div class="flex gap-2">
            <input type="text" placeholder="Type a message..." class="flex-1 bg-[#0d1217] border border-[#222f3d] rounded-xl px-3 py-1.5 text-xs text-white" />
            <button class="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded-xl text-xs">Send</button>
          </div>
        </div>
      `;
    }

    // --- ACTIONS & SUPABASE SYNC ---
    async function simulateOffer(name, reward) {
      if (!currentUser) {
        openAuthModal();
        return;
      }
      currentProfile.coins = (Number(currentProfile.coins) || 0) + reward;
      updateUIHeader();

      // Save to Supabase Profiles & Postbacks
      await supabase.from('profiles').update({ coins: currentProfile.coins }).eq('id', currentUser.id);
      await supabase.from('postbacks').insert([{
        user_id: currentUser.id,
        provider: 'Simulator',
        offer_name: name,
        coins_awarded: reward,
        status: 'completed'
      }]);

      alert(`Offer "${name}" completed! +${reward} coins added to your Supabase cloud balance.`);
    }

    async function claimDailyBonus() {
      if (!currentUser) { openAuthModal(); return; }
      currentProfile.coins = (Number(currentProfile.coins) || 0) + 100;
      updateUIHeader();
      await supabase.from('profiles').update({ coins: currentProfile.coins }).eq('id', currentUser.id);
      alert("Claimed 100 Daily Bonus coins!");
    }

    function requestCashout(crypto) {
      if (!currentUser) { openAuthModal(); return; }
      alert(`Withdrawal request for ${crypto} placed. Admin will verify via Supabase withdrawals table.`);
    }

    // --- AUTH MODAL HANDLERS ---
    function toggleProfileMenu() {
      document.getElementById('profile-dropdown').classList.toggle('hidden');
    }

    function handleAuthAction() {
      if (currentUser) {
        supabase.auth.signOut().then(() => {
          currentUser = null;
          currentProfile = { username: "Guest", coins: 0, level: 1 };
          updateUIHeader();
          toggleProfileMenu();
          location.reload();
        });
      } else {
        openAuthModal();
      }
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? "Create Dollah Account" : "Login to Dollah";
      document.getElementById('auth-submit-btn').innerText = isSignUpMode ? "Sign Up" : "Login";
    }

    async function submitAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-pass').value;
      if (!email || !password) return alert("Fill all fields");

      if (isSignUpMode) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) alert(error.message);
        else {
          alert("Account created successfully! Logging you in...");
          closeAuthModal();
          initUser();
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else {
          closeAuthModal();
          initUser();
        }
      }
    }

    // --- LIVE PUBLIC TOAST ROTATION ---
    const toastItems = [
      { tag: "Sent", title: "LTC Sent", amount: "2,573", color: "text-emerald-400 bg-emerald-500/20" },
      { tag: "Complete", title: "Animals And Coins", amount: "125", color: "text-blue-400 bg-blue-500/20" },
      { tag: "PENDING", title: "LTC Pending approval", amount: "38,010", color: "text-purple-400 bg-purple-500/20" },
      { tag: "Sent", title: "LTC Sent", amount: "21,400", color: "text-emerald-400 bg-emerald-500/20" }
    ];
    let toastIndex = 0;
    setInterval(() => {
      toastIndex = (toastIndex + 1) % toastItems.length;
      const item = toastItems[toastIndex];
      document.getElementById('toast-title').innerText = "seconds ago";
      document.getElementById('toast-desc').innerHTML = `${item.title} <span class="text-[10px] ${item.color} px-1.5 py-0.5 rounded">${item.tag}</span>`;
      document.getElementById('toast-amount').innerText = item.amount;
    }, 4500);

    // Initial load
    initUser();
  </script>
</body>
</html>
